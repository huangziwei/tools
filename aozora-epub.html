<style>
  :root {
    --bg: #ffffff;
    --fg: #111418;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #cbd5e1;
    --panel: #f8fafc;
    --panel-active: #eff6ff;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --code-bg: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --border: #262a30;
      --border-strong: #3a3f47;
      --panel: #14171c;
      --panel-active: #17253f;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --code-bg: #1a1f26;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 2rem;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 620px; }
  a { color: var(--accent); text-decoration: none; }

  .page-header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 0.25rem; }
  h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
  .github-link { color: var(--muted); display: flex; }
  .github-link:hover { color: var(--fg); text-decoration: none; }
  .lead { color: var(--muted); margin: 0 0 1.75rem; font-size: 0.95rem; }

  .field-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.4rem;
  }

  .btn-secondary {
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .btn-secondary:hover { border-color: var(--accent); }

  .btn-primary {
    padding: 0.6rem 1.5rem;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }

  .drop-zone {
    border: 2px dashed var(--border-strong);
    border-radius: 10px;
    padding: 0.75rem;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }
  .drop-zone.has-data {
    border-style: solid;
    border-color: var(--border);
    cursor: default;
  }
  .drop-zone:not(.has-data):hover {
    border-color: var(--accent);
    background: var(--panel-active);
  }
  .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--panel-active);
  }
  .drop-zone-label {
    display: block;
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }
  .drop-zone.has-data .drop-zone-label { display: none; }
  .drop-zone-info {
    display: none;
    padding: 0.5rem 0;
    font-size: 0.85rem;
    color: var(--fg);
  }
  .drop-zone.has-data .drop-zone-info { display: block; }
  .drop-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }

  .meta-fields {
    display: none;
    margin-top: 1.5rem;
  }
  .meta-fields.visible { display: block; }
  .meta-fields input {
    width: 100%;
    padding: 0.5rem 0.75rem;
    font-size: 0.9rem;
    font-family: inherit;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    outline: none;
    margin-bottom: 0.75rem;
    transition: border-color 0.15s;
  }
  .meta-fields input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
  }

  .action-row {
    display: none;
    margin-top: 1.5rem;
    gap: 0.75rem;
    align-items: center;
  }
  .action-row.visible { display: flex; }

  .status {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    display: none;
  }
  .status.visible { display: block; }
  .status.error { color: #ef4444; }

  .cover-section {
    display: none;
    margin-top: 1.5rem;
  }
  .cover-section.visible { display: block; }
  .cover-row {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }
  .cover-preview {
    width: 150px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    background: var(--panel);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .cover-preview:hover {
    border-color: var(--accent);
  }
  .cover-preview.drag-over {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .cover-preview img,
  .cover-preview svg {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }
  .cover-actions {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .preview {
    display: none;
    margin-top: 1.5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .preview.visible { display: block; }
  .preview-header {
    padding: 0.5rem 0.85rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .preview-body {
    overflow-x: auto;
    overflow-y: hidden;
    direction: rtl;
  }
  .preview-inner {
    padding: 1rem;
    font-size: 0.85rem;
    height: 360px;
    line-height: 1.8;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    writing-mode: vertical-rl;
    -webkit-writing-mode: vertical-rl;
    text-align: justify;
    direction: ltr;
    width: max-content;
  }
  .preview-inner p { text-indent: 1em; margin: 0; }
  .preview-inner rt { font-size: 0.55em; }
  .preview-inner em.sesame {
    font-style: normal;
    -webkit-text-emphasis: filled sesame;
    text-emphasis: filled sesame;

  .preview-inner em { font-style: normal; }
  .preview-inner em.open-sesame { -webkit-text-emphasis: open sesame; text-emphasis: open sesame; }
  .preview-inner em.circle { -webkit-text-emphasis: filled circle; text-emphasis: filled circle; }
  .preview-inner em.open-circle { -webkit-text-emphasis: open circle; text-emphasis: open circle; }
  .preview-inner em.triangle { -webkit-text-emphasis: filled triangle; text-emphasis: filled triangle; }
  .preview-inner em.open-triangle { -webkit-text-emphasis: open triangle; text-emphasis: open triangle; }
  .preview-inner em.double-circle { -webkit-text-emphasis: filled double-circle; text-emphasis: filled double-circle; }
  .preview-inner em.batsu { -webkit-text-emphasis: "×"; text-emphasis: "×"; }
  .preview-inner p.indent { margin-top: 1em; text-indent: 0; }
  .preview-inner .underline { text-decoration: underline; }
  .preview-inner .underline-double { text-decoration: underline double; }
  .preview-inner .underline-wavy { text-decoration: underline wavy; }
  .preview-inner .underline-dashed { text-decoration: underline dashed; }
  .preview-inner .underline-dotted { text-decoration: underline dotted; }
  .preview-inner .strikethrough { text-decoration: line-through; }
  .preview-inner .strikethrough-double { text-decoration: line-through double; }
  .preview-inner .gothic { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; }
  .preview-inner .italic { font-style: italic; }
  .preview-inner .warichu { font-size: 0.85em; }
  .preview-inner .chitsuki { display: block; text-align: end; }
  .preview-inner .keigakomi { border: 1px solid currentColor; padding: 0.2em; }
  .preview-inner .keigakomi-dashed { border: 1px dashed currentColor; padding: 0.2em; }
  .preview-inner .keigakomi-double { border: 3px double currentColor; padding: 0.2em; }
  .preview-inner img { max-height: 100%; }
  .preview-inner .colophon { margin-top: 3em; font-size: 0.85em; }
  .preview-inner .colophon p { text-indent: 0; margin: 0.2em 0; }
  .preview-inner h1 { text-indent: 0; }
  .preview-inner h2, .preview-inner h3, .preview-inner h4 { text-indent: 0; }

  footer {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--fg);
    color: var(--bg);
    padding: 0.55rem 1.1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    transition: transform 0.25s, opacity 0.25s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>

    // Postfix heading: TEXT［＃「TEXT」は<大|中|小>見出し］. The text before the
    // marker may carry ｜/《》 ruby markup; it is compared without it, and
    // rendered with it so the heading keeps its <ruby>.

    if (postfix) {

        return pending;
      }

    // Inside a box: append this line to the open box <p>.
    if (state.boxFirst !== null) {
      if (!state.boxFirst) state.html += '<br/>';
      if (raw.trim()) state.html += convertAozoraLine(raw);
      state.boxFirst = false;

    if (!raw.trim()) {
      state.html += '<p><br/></p>\n';

    var blockClasses = state.blockStyles.filter(function(s) { return s; });
    var pAttr = lineIndent ? indentAttrs(lineIndent, blockClasses)

  // --- Ruby ---

  // base backwards over the sentence.

    if (cp >= 0x3041 && cp <= 0x309F) return 'H';
    if ((cp >= 0x30A1 && cp <= 0x30FF) || (cp >= 0x31F0 && cp <= 0x31FF) ||

    if (bar !== -1) return bar;
    if (!head) return -1;
    var last = charBefore(head, head.length);
    // An element ends here (<img …/>, </ruby>). Text-level < and > are
    // escaped, so the nearest < is this tag's start.
    if (last === '>') return head.lastIndexOf('<');
    // 〔…〕 wraps accent-decomposed Western text and takes ruby as one unit.
    if (last === '〕') return head.lastIndexOf('〔');
    var cls = rubyClass(last);
    if (cls === 'O') return head.length - last.length;
    var start = head.length;
    while (start > 0) {

      if (rubyClass(ch) !== cls) break;

  // is recorded in its alt text instead.
  function foldReadingIntoAlt(base, reading) {
    var a = base.indexOf(' alt="');

    var alt = base.substring(a, e);

    return base.substring(0, a) + alt + '（' + reading + '）' + base.substring(e);

      if (!reading) continue;

      var rel = rubyBaseStart(s.substring(copied, open));

      var baseStart = copied + rel;
      out += s.substring(copied, baseStart);

  // --- Aozora XHTML parser ---

  function parseXhtml(text) {
    var parser = new DOMParser();

    var author = authorMeta ? authorMeta.getAttribute('content') : '';

      if (h1) title = h1.textContent.trim();

    if (!author) {
      var h2 = doc.querySelector('.author, h2');

    // Divider between title and author
    var divY = titleY + titleLines.length * titleSpacing + 16;
    svg += '<line x1="' + (w / 2 - 50) + '" y1="' + divY + '" x2="' + (w / 2 + 50) + '" y2="' + divY + '" stroke="' + border + '" stroke-width="1"/>\n';

    // Author
    var authorY = divY + 40 + authorFontSize;
    svg += '<text x="' + (w / 2) + '" y="' + authorY + '" text-anchor="middle" font-family="' + font + '" font-size="' + authorFontSize + '" fill="' + muted + '">' + escapeXml(author) + '</text>\n';

    svg += '</svg>';
    return svg;
  }

  // Rasterize the generated cover to JPEG: many readers (Kindle among them)
  // show no SVG cover image.
  function renderCoverJpeg(title, author) {
    return new Promise(function(resolve, reject) {
      var url = URL.createObjectURL(new Blob([buildCoverSvg(title, author)], { type: 'image/svg+xml' }));
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        canvas.width = 1050;
        canvas.height = 1500;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        try {
          canvas.toBlob(function(blob) {
            if (!blob) { reject(new Error('cover render failed')); return; }
            blob.arrayBuffer().then(function(buf) {
              resolve({ data: new Uint8Array(buf), mime: 'image/jpeg' });
            }, reject);
          }, 'image/jpeg', 0.85);
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = function() {
        URL.revokeObjectURL(url);
        reject(new Error('cover render failed'));
      };
      img.src = url;
    });
  }

  // `cover` is {data, mime}; the SVG cover is the fallback when it is null.
  function buildEpub(title, author, bodyXhtml, images, toc, colophon, cover) {
    var zip = new JSZip();
    var uuid = uuidV5('aozora:' + title + ':' + author);

    // mimetype must be first, uncompressed
    zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });

    // container.xml
    zip.file('META-INF/container.xml',
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">\n' +
      '  <rootfiles>\n' +
      '    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>\n' +
      '  </rootfiles>\n' +
      '</container>'
    );

    // Style
    var css =
      '@charset "utf-8";\n' +
      'body {\n' +
      '  writing-mode: vertical-rl;\n' +
      '  -webkit-writing-mode: vertical-rl;\n' +
      '  -epub-writing-mode: vertical-rl;\n' +
      '  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;\n' +
      '  line-height: 1.8;\n' +
      '  margin: 1.5em;\n' +
      '  text-align: justify;\n' +
      '}\n' +
      'p {\n' +
      '  text-indent: 1em;\n' +
      '  margin: 0;\n' +
      '}\n' +
      'h1, h2, h3, h4 { text-indent: 0; }\n' +
      'em.sesame {\n' +
      '  font-style: normal;\n' +
      '  -webkit-text-emphasis: filled sesame;\n' +
      '  text-emphasis: filled sesame;\n' +
      '}\n' +
      'rt { font-size: 0.55em; }\n' +
      'p.indent { margin-top: 1em; text-indent: 0; }\n' +
      'img { max-width: 100%; max-height: 100%; }\n' +
      '.underline { text-decoration: underline; }\n' +
      '.underline-double { text-decoration: underline double; }\n' +
      '.underline-wavy { text-decoration: underline wavy; }\n' +
      '.underline-dashed { text-decoration: underline dashed; }\n' +
      '.underline-dotted { text-decoration: underline dotted; }\n' +
      '.strikethrough { text-decoration: line-through; }\n' +
      '.strikethrough-double { text-decoration: line-through double; }\n' +
      'em.open-sesame { font-style: normal; -webkit-text-emphasis: open sesame; text-emphasis: open sesame; }\n' +
      'em.circle { font-style: normal; -webkit-text-emphasis: filled circle; text-emphasis: filled circle; }\n' +
      'em.open-circle { font-style: normal; -webkit-text-emphasis: open circle; text-emphasis: open circle; }\n' +
      'em.triangle { font-style: normal; -webkit-text-emphasis: filled triangle; text-emphasis: filled triangle; }\n' +
      'em.open-triangle { font-style: normal; -webkit-text-emphasis: open triangle; text-emphasis: open triangle; }\n' +
      'em.double-circle { font-style: normal; -webkit-text-emphasis: filled double-circle; text-emphasis: filled double-circle; }\n' +
      'em.batsu { font-style: normal; -webkit-text-emphasis: "×"; text-emphasis: "×"; }\n' +
      '.gothic { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; }\n' +
      '.italic { font-style: italic; }\n' +
      '.warichu { font-size: 0.85em; }\n' +
      '.chitsuki { display: block; text-align: end; }\n' +
      '.keigakomi { border: 1px solid currentColor; padding: 0.2em; break-inside: avoid; }\n' +
      '.keigakomi-dashed { border: 1px dashed currentColor; padding: 0.2em; break-inside: avoid; }\n' +
      '.keigakomi-double { border: 3px double currentColor; padding: 0.2em; break-inside: avoid; }\n' +
      '.colophon { margin-top: 3em; font-size: 0.85em; }\n' +
      '.colophon p { text-indent: 0; margin: 0.2em 0; }\n';
    zip.file('OEBPS/style.css', css);

    // Cover
    var coverFileName, coverMime;
    if (cover) {
      var ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' }[cover.mime] || 'png';
      coverFileName = 'cover.' + ext;
      coverMime = cover.mime;
      zip.file('OEBPS/images/' + coverFileName, cover.data);
    } else {
      coverFileName = 'cover.svg';
      coverMime = 'image/svg+xml';
      zip.file('OEBPS/images/cover.svg', buildCoverSvg(title, author));
    }

    var coverXhtml =
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<!DOCTYPE html>\n' +
      '<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="ja">\n' +
      '<head><meta charset="UTF-8"/><title>Cover</title>\n' +
      '<style>body { margin: 0; padding: 0; text-align: center; } img { max-width: 100%; max-height: 100%; }</style>\n' +
      '</head>\n' +
      '<body epub:type="cover"><img src="../images/' + coverFileName + '" alt="Cover"/></body>\n' +
      '</html>';
    zip.file('OEBPS/text/cover.xhtml', coverXhtml);

    // --- Split body into chapters at the shallowest heading level present ---
    var chapters = []; // [{file, title, body}]
    var splitLevel = 2;
    if (toc.length) {
      splitLevel = Math.min.apply(null, toc.map(function(e) { return e.level; }));
    }
    var splits = bodyXhtml.split(new RegExp('(?=<h' + splitLevel + '[\\s>])'));

    // A body opening on a heading has no front matter: the title page is title
    // and author only, and that heading begins ch1.
    var firstIsHeading = new RegExp('^\\s*<h' + splitLevel + '[\\s>]').test(splits[0]);
    var titleBody = '<h1>' + escapeXml(title) + '</h1>\n<p>' + escapeXml(author) + '</p>\n' +
      (firstIsHeading ? '' : splits[0]);
    chapters.push({ file: 'title.xhtml', title: title, body: titleBody });

    for (var si = firstIsHeading ? 0 : 1; si < splits.length; si++) {
      var chBody = splits[si];
      var chNum = chapters.length;
      var chTitleMatch = chBody.match(new RegExp('<h' + splitLevel + '[^>]*>([\\s\\S]*?)</h' + splitLevel + '>'));
      var chTitle = chTitleMatch ? headingLabel(chTitleMatch[1]) : 'Chapter ' + chNum;
      chapters.push({ file: 'ch' + chNum + '.xhtml', title: chTitle, body: chBody });
    }

    // Colophon as separate chapter. It is written in the same notation as the
    // body (gaiji, ruby), so it goes through the same line conversion.
    if (colophon) {
      var colBody = '<div class="colophon" id="colophon">\n';
      var cLines = colophon.split('\n');
      for (var ci = 0; ci < cLines.length; ci++) {
        colBody += '<p>' + convertAozoraLine(cLines[ci]) + '</p>\n';
      }
      colBody += '</div>\n';
      chapters.push({ file: 'colophon.xhtml', title: '底本情報', body: colBody });
    }

    // Write chapter XHTML files
    function wrapXhtml(chTitle, chBody) {
      return '<?xml version="1.0" encoding="UTF-8"?>\n' +
        '<!DOCTYPE html>\n' +
        '<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="ja" lang="ja">\n' +
        '<head>\n' +
        '  <meta charset="UTF-8"/>\n' +
        '  <title>' + escapeXml(chTitle) + '</title>\n' +
        '  <link rel="stylesheet" type="text/css" href="../style.css"/>\n' +
        '</head>\n' +
        '<body>\n' + chBody + '\n</body>\n</html>';
    }
    var chapterManifest = '';
    var chapterSpine = '';
    for (var ch = 0; ch < chapters.length; ch++) {
      zip.file('OEBPS/text/' + chapters[ch].file, wrapXhtml(chapters[ch].title, chapters[ch].body));
      chapterManifest += '    <item id="ch' + ch + '" href="text/' + chapters[ch].file + '" media-type="application/xhtml+xml"/>\n';
      chapterSpine += '    <itemref idref="ch' + ch + '"/>\n';
    }

    // Images
    var imageManifest = '';
    for (var i = 0; i < images.length; i++) {
      var img = images[i];
      zip.file('OEBPS/images/' + img.name, img.data);
      imageManifest += '    <item id="img' + i + '" href="images/' + escapeXml(img.name) + '" media-type="' + img.mime + '"/>\n';
    }

    // Build file-to-chapter map for TOC links
    // Each TOC entry's id (h1, h2, ...) maps to the chapter file containing it
    var idToFile = {};
    for (var ch = 0; ch < chapters.length; ch++) {
      var idMatches = chapters[ch].body.match(/id="(h\d+)"/g);
      if (idMatches) {
        for (var im = 0; im < idMatches.length; im++) {
          var hid = idMatches[im].match(/id="(h\d+)"/)[1];
          idToFile[hid] = chapters[ch].file;
        }
      }
    }

    // Build TOC
    function tocHref(entry) {
      var f = idToFile[entry.id] || 'title.xhtml';
      return 'text/' + f + '#' + entry.id;
    }

    function buildNavOl(entries) {
      var ol = '<ol>\n';
      ol += '<li><a href="text/title.xhtml">' + escapeXml(title) + '</a></li>\n';
      if (!entries.length && colophon) {
        ol += '<li><a href="text/colophon.xhtml">底本情報</a></li>\n';
        ol += '</ol>';
        return ol;
      }
      var i = 0;
      while (i < entries.length) {
        var e = entries[i];
        if (e.level === 2) {
          ol += '<li><a href="' + tocHref(e) + '">' + escapeXml(e.text) + '</a>';
          var children = [];
          i++;
          while (i < entries.length && entries[i].level > 2) {
            children.push(entries[i]);
            i++;
          }
          if (children.length) {
            ol += '\n<ol>\n';
            for (var c = 0; c < children.length; c++) {
              ol += '<li><a href="' + tocHref(children[c]) + '">' + escapeXml(children[c].text) + '</a></li>\n';
            }
            ol += '</ol>\n';
          }
          ol += '</li>\n';
        } else {
          ol += '<li><a href="' + tocHref(e) + '">' + escapeXml(e.text) + '</a></li>\n';
          i++;
        }
      }
      if (colophon) {
        ol += '<li><a href="text/colophon.xhtml">底本情報</a></li>\n';
      }
      ol += '</ol>';
      return ol;
    }

    // TOC (nav)
    var navXhtml =
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<!DOCTYPE html>\n' +
      '<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="ja">\n' +
      '<head><meta charset="UTF-8"/><title>Navigation</title>\n' +
      '<link rel="stylesheet" type="text/css" href="style.css"/>\n' +
      '</head>\n' +
      '<body>\n' +
      '<nav epub:type="toc" id="toc">\n' +
      '  <h1>目次</h1>\n' +
      '  ' + buildNavOl(toc) + '\n' +
      '</nav>\n' +
      '</body>\n' +
      '</html>';
    zip.file('OEBPS/toc.xhtml', navXhtml);

    // NCX (for EPUB 2 compat)
    var ncxPoints = '';
    ncxPoints += '  <navPoint id="np0" playOrder="0">\n' +
      '    <navLabel><text>' + escapeXml(title) + '</text></navLabel>\n' +
      '    <content src="text/title.xhtml"/>\n' +
      '  </navPoint>\n';
    for (var t = 0; t < toc.length; t++) {
      ncxPoints += '  <navPoint id="np' + (t + 1) + '" playOrder="' + (t + 1) + '">\n' +
        '    <navLabel><text>' + escapeXml(toc[t].text) + '</text></navLabel>\n' +
        '    <content src="' + tocHref(toc[t]) + '"/>\n' +
        '  </navPoint>\n';
    }
    if (colophon) {
      var cn = toc.length + 1;
      ncxPoints += '  <navPoint id="np' + cn + '" playOrder="' + cn + '">\n' +
        '    <navLabel><text>底本情報</text></navLabel>\n' +
        '    <content src="text/colophon.xhtml"/>\n' +
        '  </navPoint>\n';
    }

    var ncx =
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">\n' +
      '<head><meta name="dtb:uid" content="urn:uuid:' + uuid + '"/></head>\n' +
      '<docTitle><text>' + escapeXml(title) + '</text></docTitle>\n' +
      '<navMap>\n' + ncxPoints + '</navMap>\n' +
      '</ncx>';
    zip.file('OEBPS/toc.ncx', ncx);

    // The EPUB's publisher is 青空文庫, the digital publisher; the print
    // edition only contributes its date.
    var pubDate = '';
    if (colophon) {
      var dateMatch = colophon.match(/(\d{4})[（(].*?[）)]\s*年\s*(\d{1,2})\s*月/);
      if (dateMatch) pubDate = dateMatch[1] + '-' + dateMatch[2].padStart(2, '0');
    }

    // OPF
    var opf =
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<package xmlns="http://www.idpf.org/2007/opf" version="3.0"\n' +
      '         unique-identifier="uid" xml:lang="ja" prefix="rendition: http://www.idpf.org/vocab/rendition/#">\n' +
      '  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">\n' +
      '    <dc:identifier id="uid">urn:uuid:' + uuid + '</dc:identifier>\n' +
      '    <dc:title>' + escapeXml(title) + '</dc:title>\n' +
      '    <dc:creator>' + escapeXml(author) + '</dc:creator>\n' +
      '    <dc:language>ja</dc:language>\n' +
      '    <dc:publisher>青空文庫</dc:publisher>\n' +
      (pubDate ? '    <dc:date>' + pubDate + '</dc:date>\n' : '') +
      '    <dc:source>https://www.aozora.gr.jp/</dc:source>\n' +
      '    <meta property="dcterms:modified">' + new Date().toISOString().replace(/\.\d+Z/, 'Z') + '</meta>\n' +
      '    <meta property="rendition:layout">reflowable</meta>\n' +
      '    <meta name="primary-writing-mode" content="vertical-rl"/>\n' +
      '  </metadata>\n' +
      '  <manifest>\n' +
      '    <item id="cover" href="text/cover.xhtml" media-type="application/xhtml+xml"/>\n' +
      '    <item id="cover-image" href="images/' + coverFileName + '" media-type="' + coverMime + '" properties="cover-image"/>\n' +
      chapterManifest +
      '    <item id="style" href="style.css" media-type="text/css"/>\n' +
      '    <item id="nav" href="toc.xhtml" media-type="application/xhtml+xml" properties="nav"/>\n' +
      '    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>\n' +
      imageManifest +
      '  </manifest>\n' +
      '  <spine page-progression-direction="rtl" toc="ncx">\n' +
      '    <itemref idref="cover"/>\n' +
      chapterSpine +
      '  </spine>\n' +
      '</package>';
    zip.file('OEBPS/content.opf', opf);

    return zip;
  }

  // --- File handling ---

  function processFile(file) {
    var name = file.name.toLowerCase();
    var reader = new FileReader();
    reader.onload = function(e) {
      var buf = e.target.result;
      images = [];
      if (name.endsWith('.zip')) {
        processZip(buf, file.name);
      } else if (name.endsWith('.html') || name.endsWith('.htm')) {
        var text = detectAndDecode(buf);
        var result = parseXhtml(text);
        setResult(result, file.name);
      } else {
        var text = detectAndDecode(buf);
        var result = parseTxt(text);
        setResult(result, file.name);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function processZip(buf, fileName) {
    JSZip.loadAsync(buf).then(function(zip) {
      var htmlFile = null;
      var txtFile = null;
      var imgFiles = [];

      zip.forEach(function(path, entry) {
        if (entry.dir) return;
        var lower = path.toLowerCase();
        if (lower.endsWith('.html') || lower.endsWith('.htm')) htmlFile = entry;
        else if (lower.endsWith('.txt')) txtFile = entry;
        else if (/\.(jpe?g|png|gif|svg|webp)$/i.test(lower)) imgFiles.push(entry);
      });

      var mainFile = htmlFile || txtFile;
      if (!mainFile) {
        showStatus('No .html or .txt file found in ZIP.', true);
        return;
      }

      var promises = [];
      promises.push(mainFile.async('arraybuffer'));
      imgFiles.forEach(function(img) {
        promises.push(img.async('uint8array').then(function(data) {
          var name = img.name.split('/').pop();
          var ext = name.split('.').pop().toLowerCase();
          var mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
                       gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' }[ext] || 'application/octet-stream';
          return { name: name, data: data, mime: mime };
        }));
      });

      Promise.all(promises).then(function(results) {
        var textBuf = results[0];
        var text = detectAndDecode(textBuf);
        var result;
        if (htmlFile) {
          result = parseXhtml(text);
        } else {
          result = parseTxt(text);
        }
        images = results.slice(1);
        setResult(result, fileName);
      });
    }).catch(function(err) {
      showStatus('Failed to read ZIP: ' + err.message, true);
    });
  }

  function setResult(result, fileName) {
    bookTitle = result.title;
    bookAuthor = result.author;
    bodyXhtml = result.body;
    bookToc = result.toc || [];
    bookColophon = result.colophon || '';

    titleInput.value = bookTitle;
    authorInput.value = bookAuthor;

    var info = fileName;
    if (images.length) info += ' + ' + images.length + ' image' + (images.length > 1 ? 's' : '');
    fileInfo.textContent = info;

    dropZone.classList.add('has-data');
    clearBtn.style.display = '';
    metaFields.classList.add('visible');
    actionRow.classList.add('visible');
    coverSection.classList.add('visible');
    statusEl.classList.remove('visible');
    customCover = null;
    resetCoverBtn.style.display = 'none';

    updateCoverPreview();

    // Show preview — match EPUB content structure
    var previewHtml = '<h1>' + escapeXml(bookTitle) + '</h1>\n<p>' + escapeXml(bookAuthor) + '</p>\n' + bodyXhtml;
    if (bookColophon) {
      previewHtml += '<div class="colophon">';
      bookColophon.split('\n').forEach(function(line) {
        previewHtml += '<p>' + convertAozoraLine(line) + '</p>';
      });
      previewHtml += '</div>';
    }
    revokePreviewImages();
    previewHtml = previewHtml.replace(/src="\.\.\/images\/([^"]*)"/g, function(m, name) {
      var img = images.find(function(im) { return escapeXml(im.name) === name; });
      if (!img) return m;
      var url = URL.createObjectURL(new Blob([img.data], { type: img.mime }));
      previewImageUrls.push(url);
      return 'src="' + url + '"';
    });
    previewBody.innerHTML = previewHtml;
    preview.classList.add('visible');
    // Scroll to start (right edge in vertical-rl)
    requestAnimationFrame(function() { document.getElementById('previewScroll').scrollLeft = 0; });
  }

  function updateCoverPreview() {
    if (customCover) {
      var blob = new Blob([customCover.data], { type: customCover.mime });
      var img = document.createElement('img');
      img.src = URL.createObjectURL(blob);
      coverPreview.innerHTML = '';
      coverPreview.appendChild(img);
    } else {
      var t = titleInput.value.trim() || bookTitle || 'Untitled';
      var a = authorInput.value.trim() || bookAuthor || 'Unknown';
      coverPreview.innerHTML = buildCoverSvg(t, a);
    }
  }

  function revokePreviewImages() {
    previewImageUrls.forEach(function(url) { URL.revokeObjectURL(url); });
    previewImageUrls = [];
  }

  function clearAll() {
    revokePreviewImages();
    bookTitle = '';
    bookAuthor = '';
    bodyXhtml = '';
    bookToc = [];
    bookColophon = '';
    images = [];
    titleInput.value = '';
    authorInput.value = '';
    fileInfo.textContent = '';
    customCover = null;
    dropZone.classList.remove('has-data');
    clearBtn.style.display = 'none';
    metaFields.classList.remove('visible');
    actionRow.classList.remove('visible');
    coverSection.classList.remove('visible');
    coverPreview.innerHTML = '';
    resetCoverBtn.style.display = 'none';
    statusEl.classList.remove('visible');
    preview.classList.remove('visible');
    previewBody.innerHTML = '';
    fileInput.value = '';
  }

  function showStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
    statusEl.classList.add('visible');
  }

  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }

  // --- Events ---

  dropZone.addEventListener('click', function(e) {
    if (dropZone.classList.contains('has-data')) return;
    if (e.target === clearBtn) return;
    fileInput.click();
  });

  fileInput.addEventListener('change', function() {
    var file = fileInput.files[0];
    if (file) processFile(file);
  });

  clearBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    clearAll();
  });

  ['dragenter', 'dragover'].forEach(function(name) {
    dropZone.addEventListener(name, function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('drag-over');
    });
  });
  ['dragleave', 'drop'].forEach(function(name) {
    dropZone.addEventListener(name, function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');
    });
  });
  dropZone.addEventListener('drop', function(e) {
    var file = e.dataTransfer.files[0];
    if (file) processFile(file);
  });

  // Cover: click to browse, drag-and-drop to replace
  function loadCoverFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      customCover = { data: new Uint8Array(e.target.result), mime: file.type };
      resetCoverBtn.style.display = '';
      updateCoverPreview();
    };
    reader.readAsArrayBuffer(file);
  }
  coverPreview.addEventListener('click', function() { coverFileInput.click(); });
  coverFileInput.addEventListener('change', function() {
    if (coverFileInput.files[0]) loadCoverFile(coverFileInput.files[0]);
  });
  ['dragenter', 'dragover'].forEach(function(name) {
    coverPreview.addEventListener(name, function(e) {
      e.preventDefault(); e.stopPropagation();
      coverPreview.classList.add('drag-over');
    });
  });
  ['dragleave', 'drop'].forEach(function(name) {
    coverPreview.addEventListener(name, function(e) {
      e.preventDefault(); e.stopPropagation();
      coverPreview.classList.remove('drag-over');
    });
  });
  coverPreview.addEventListener('drop', function(e) {
    if (e.dataTransfer.files[0]) loadCoverFile(e.dataTransfer.files[0]);
  });
  resetCoverBtn.addEventListener('click', function() {
    customCover = null;
    resetCoverBtn.style.display = 'none';
    coverFileInput.value = '';
    updateCoverPreview();
  });

  // Refresh cover preview when title/author changes
  var coverRefreshTimer = null;
  function debouncedCoverRefresh() {
    clearTimeout(coverRefreshTimer);
    coverRefreshTimer = setTimeout(function() {
      if (!customCover && coverSection.classList.contains('visible')) updateCoverPreview();
    }, 300);
  }
  titleInput.addEventListener('input', debouncedCoverRefresh);
  authorInput.addEventListener('input', debouncedCoverRefresh);

  // Convert button
  convertBtn.addEventListener('click', function() {
    var title = titleInput.value.trim() || bookTitle || 'Untitled';
    var author = authorInput.value.trim() || bookAuthor || 'Unknown';

    if (!bodyXhtml) {
      showStatus('No content to convert.', true);
      return;
    }

    convertBtn.disabled = true;
    showStatus('Generating EPUB\u2026');

    var coverReady = customCover ? Promise.resolve(customCover)
      : renderCoverJpeg(title, author).catch(function() { return null; });
    coverReady.then(function(cover) {
      var epub = buildEpub(title, author, bodyXhtml, images, bookToc, bookColophon, cover);
      return epub.generateAsync({ type: 'blob', mimeType: 'application/epub+zip' });
    }).then(function(blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (title + ' - ' + author).replace(/[\/\\:*?"<>|]/g, '_') + '.epub';
      a.click();
      URL.revokeObjectURL(a.href);
      convertBtn.disabled = false;
      statusEl.classList.remove('visible');
      showToast('EPUB downloaded');
    }).catch(function(err) {
      convertBtn.disabled = false;
      showStatus('EPUB generation failed: ' + err.message, true);
    });
  });
</script>
</body>
</html>
