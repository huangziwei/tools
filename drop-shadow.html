<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Shadow</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111418;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #cbd5e1;
    --panel: #f8fafc;
    --panel-active: #eff6ff;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #b91c1c;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --border: #262a30;
      --border-strong: #3a3f47;
      --panel: #14171c;
      --panel-active: #17253f;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --error: #fca5a5;
      --error-bg: #1f0e0f;
      --error-border: #7f1d1d;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 2rem;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }

  .page-header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 0.5rem; }
  h1 { font-size: 1.75rem; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .github-link { color: var(--muted); display: flex; }
  .github-link:hover { color: var(--fg); text-decoration: none; }
  p.lead { color: var(--muted); margin: 0 0 2rem; font-size: 0.95rem; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); text-decoration: underline; }

  .drop-zone {
    display: block;
    border: 2px dashed var(--border-strong);
    border-radius: 12px;
    padding: 2.25rem 1.5rem;
    text-align: center;
    background: var(--panel);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--panel-active);
  }
  .drop-zone:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .drop-icon { width: 36px; height: 36px; color: var(--muted); margin-bottom: 0.6rem; }
  .drop-text { font-size: 0.98rem; margin: 0 0 0.2rem; }
  .drop-text strong { font-weight: 600; }
  .drop-hint { color: var(--muted); font-size: 0.82rem; margin: 0; }
  .drop-hint kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78em;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0.05em 0.35em;
  }

  input[type="file"] {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  /* --- controls --- */
  .controls {
    display: none;
    margin-top: 1.6rem;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem 1.4rem;
  }
  .controls.shown { display: grid; }
  @media (max-width: 520px) { .controls.shown { grid-template-columns: 1fr; } }

  .control { min-width: 0; }
  .control-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }
  .control-head label { font-size: 0.85rem; font-weight: 500; color: var(--fg); }
  .control-val {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: var(--border-strong);
    outline: none;
    margin: 0.5rem 0;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--border-strong);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--border-strong);
    cursor: pointer;
  }

  .seg-row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .seg-btn {
    padding: 0.4rem 0.85rem;
    font-size: 0.82rem;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .seg-btn:hover { border-color: var(--accent); background: var(--panel-active); }
  .seg-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 34px; height: 34px;
    padding: 0;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }
  input[type="color"]:disabled { opacity: 0.35; cursor: not-allowed; }

  /* --- results --- */
  .results { margin-top: 1.8rem; display: flex; flex-direction: column; gap: 1.1rem; }
  .result-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    padding: 0.75rem;
    position: relative;
  }
  .result-canvas-wrap {
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.4rem;
    /* checkerboard so transparency reads clearly */
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, var(--border) 25%, transparent 25%),
      linear-gradient(-45deg, var(--border) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--border) 75%),
      linear-gradient(-45deg, transparent 75%, var(--border) 75%);
    background-size: 18px 18px;
    background-position: 0 0, 0 9px, 9px -9px, -9px 0;
  }
  .result-canvas-wrap canvas { max-width: 100%; height: auto; display: block; }
  .result-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-top: 0.7rem;
    flex-wrap: wrap;
  }
  .result-meta {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
    word-break: break-word;
    min-width: 0;
  }
  .result-meta strong { color: var(--fg); font-weight: 500; }
  .result-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .card-remove {
    position: absolute;
    top: 0.55rem; right: 0.55rem;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .result-card:hover .card-remove { opacity: 1; }
  .card-remove:hover { background: rgba(0,0,0,0.7); }

  .status {
    margin-top: 1rem;
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
    display: none;
    line-height: 1.5;
  }
  .status.error {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error);
    display: block;
  }

  .btn-row { margin-top: 1.4rem; display: none; gap: 0.6rem; flex-wrap: wrap; }
  .btn-row.shown { display: flex; }
  .btn-primary {
    padding: 0.55rem 1.1rem;
    font-size: 0.88rem;
    font-family: inherit;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    padding: 0.5rem 0.95rem;
    font-size: 0.85rem;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .btn-secondary:hover { border-color: var(--accent); }

  footer {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <div class="page-header">
    <h1>Drop Shadow</h1>
    <!-- SOURCE_LINK_START --><a href="https://github.com/huangziwei/tools/blob/main/drop-shadow.html" target="_blank" rel="noopener" class="github-link" title="View source on GitHub"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a><!-- SOURCE_LINK_END -->
  </div>
  <p class="lead">Wrap a screenshot or image in macOS's window drop shadow.</p>

  <label class="drop-zone" id="dropZone" for="fileInput">
    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <p class="drop-text"><strong>Drop images here</strong> or click to choose</p>
    <p class="drop-hint">PNG, JPEG, WebP, GIF &middot; or paste with <kbd>&#8984;V</kbd></p>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>

  <div class="controls" id="controls">
    <div class="control">
      <div class="control-head"><label for="sizeRange">Shadow size</label><span class="control-val" id="sizeVal">100%</span></div>
      <input type="range" id="sizeRange" min="0" max="200" step="5" value="100">
    </div>
    <div class="control">
      <div class="control-head"><label for="opacityRange">Shadow opacity</label><span class="control-val" id="opacityVal">100%</span></div>
      <input type="range" id="opacityRange" min="0" max="100" step="5" value="100">
    </div>
    <div class="control">
      <div class="control-head"><label for="radiusRange">Corner radius</label><span class="control-val" id="radiusVal">0 px</span></div>
      <input type="range" id="radiusRange" min="0" max="48" step="1" value="0">
    </div>
    <div class="control">
      <div class="control-head"><label for="marginRange">Margin</label><span class="control-val" id="marginVal">0 px</span></div>
      <input type="range" id="marginRange" min="0" max="240" step="4" value="0">
    </div>
    <div class="control" style="grid-column: 1 / -1;">
      <div class="control-head"><label>Background</label></div>
      <div class="seg-row">
        <button type="button" class="seg-btn active" data-bg="transparent">Transparent</button>
        <button type="button" class="seg-btn" data-bg="color">Solid color</button>
        <input type="color" id="bgColor" value="#ffffff" disabled aria-label="Background color">
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="results" id="results"></div>

  <div class="btn-row" id="btnRow">
    <button class="btn-primary" id="downloadAll">Download all</button>
    <button class="btn-secondary" id="resetBtn">Start over</button>
  </div>

  <footer>
    All data stays on your device.<br>
    <!-- TOOL_META_START --><time datetime="2026-05-25T08:17:18+02:00">Added 2026/05/25 08:17</time><!-- TOOL_META_END -->
  </footer>
</main>

<script>
  // Shadow calibrated against real macOS captures (cmd+shift+4+space),
  // measured in 2x device pixels. 100% size assumes a Retina screenshot.
  //   ambient: black, pre-blur alpha 0.667, gaussian sigma 40 (blur 80), offset y 38
  //   contact: black, pre-blur alpha 0.92,  gaussian sigma 3  (blur 6),  offset y 2
  //   padding: left/right 112, top 76, bottom 148  (= blur x 1.40 / 0.95 / 1.85)
  const SHADOW = {
    ambBlur: 80, ambDy: 38, ambA: 0.667,
    conBlur: 6,  conDy: 2,  conA: 0.92,
    padX: 112, padTop: 76, padBot: 148,
  };
  const PREVIEW_MAX = 1400; // cap preview bitmap (device px); download stays full-res

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const controls = document.getElementById('controls');
  const results = document.getElementById('results');
  const btnRow = document.getElementById('btnRow');
  const statusEl = document.getElementById('status');
  const sizeRange = document.getElementById('sizeRange');
  const opacityRange = document.getElementById('opacityRange');
  const radiusRange = document.getElementById('radiusRange');
  const marginRange = document.getElementById('marginRange');
  const sizeVal = document.getElementById('sizeVal');
  const opacityVal = document.getElementById('opacityVal');
  const radiusVal = document.getElementById('radiusVal');
  const marginVal = document.getElementById('marginVal');
  const bgColor = document.getElementById('bgColor');
  const downloadAll = document.getElementById('downloadAll');
  const resetBtn = document.getElementById('resetBtn');

  let items = [];        // { id, img, url, name, canvas, meta, _caster, _casterR }
  let idSeq = 0;
  let bgMode = 'transparent';
  let renderTimer = null;

  function showError(msg) {
    statusEl.className = 'status error';
    statusEl.textContent = msg;
  }
  function clearError() { statusEl.className = 'status'; statusEl.textContent = ''; }

  function getParams() {
    return {
      scale: +sizeRange.value / 100,
      opacity: +opacityRange.value / 100,
      radius: +radiusRange.value,
      margin: +marginRange.value,
      bg: bgMode === 'color' ? bgColor.value : null,
    };
  }

  function layout(iw, ih, p) {
    const padX = SHADOW.padX * p.scale + p.margin;
    const padTop = SHADOW.padTop * p.scale + p.margin;
    const padBot = SHADOW.padBot * p.scale + p.margin;
    return {
      outW: iw + padX * 2,
      outH: ih + padTop + padBot,
      imgX: padX, imgY: padTop,
    };
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // The shape that casts the shadow (and gets drawn). When a corner radius is
  // set, pre-render a rounded copy so the shadow follows the rounded corners.
  function getCaster(item, radius) {
    if (radius <= 0) return item.img;
    if (item._caster && item._casterR === radius) return item._caster;
    const iw = item.img.naturalWidth, ih = item.img.naturalHeight;
    const c = document.createElement('canvas');
    c.width = iw; c.height = ih;
    const cx = c.getContext('2d');
    roundRectPath(cx, 0, 0, iw, ih, radius);
    cx.clip();
    cx.drawImage(item.img, 0, 0);
    item._caster = c; item._casterR = radius;
    return c;
  }

  // Draw one shadow layer only (no visible image): draw the caster far off the
  // left edge and bring just its shadow back onto the canvas via shadowOffsetX.
  function shadowLayer(ctx, caster, dx, dy, dw, dh, blur, offY, alpha) {
    if (alpha <= 0) return;
    const off = ctx.canvas.width + dw + 200;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,' + alpha + ')';
    ctx.shadowBlur = blur;
    ctx.shadowOffsetX = off;
    ctx.shadowOffsetY = offY;
    ctx.drawImage(caster, dx - off, dy, dw, dh);
    ctx.restore();
  }

  // Render `item` into `canvas` at output-scale S (1 = full resolution).
  function render(canvas, item, p, S) {
    const iw = item.img.naturalWidth, ih = item.img.naturalHeight;
    const L = layout(iw, ih, p);
    canvas.width = Math.max(1, Math.round(L.outW * S));
    canvas.height = Math.max(1, Math.round(L.outH * S));
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingQuality = 'high';

    if (p.bg) { ctx.fillStyle = p.bg; ctx.fillRect(0, 0, canvas.width, canvas.height); }

    const caster = getCaster(item, p.radius);
    const dx = L.imgX * S, dy = L.imgY * S, dw = iw * S, dh = ih * S;
    const oA = p.opacity;
    shadowLayer(ctx, caster, dx, dy, dw, dh, SHADOW.ambBlur * p.scale * S, SHADOW.ambDy * p.scale * S, SHADOW.ambA * oA);
    shadowLayer(ctx, caster, dx, dy, dw, dh, SHADOW.conBlur * p.scale * S, SHADOW.conDy * p.scale * S, SHADOW.conA * oA);
    ctx.drawImage(caster, dx, dy, dw, dh);
    return L;
  }

  function renderPreview(item) {
    const p = getParams();
    const iw = item.img.naturalWidth, ih = item.img.naturalHeight;
    const L = layout(iw, ih, p);
    const S = Math.min(1, PREVIEW_MAX / Math.max(L.outW, L.outH));
    render(item.canvas, item, p, S);
    item.meta.innerHTML = '<strong>' + escapeHtml(item.name) + '</strong><br>' +
      Math.round(L.outW) + ' &times; ' + Math.round(L.outH) + ' px';
  }

  function renderAll() {
    for (const item of items) renderPreview(item);
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderAll, 70);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function outName(item) {
    const base = (item.name || 'image').replace(/\.[^.]+$/, '') || 'image';
    return base + '-shadow.png';
  }

  function downloadCanvas(canvas, filename) {
    canvas.toBlob(blob => {
      if (!blob) { showError('Could not export this image.'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  }

  function fullRender(item) {
    const canvas = document.createElement('canvas');
    render(canvas, item, getParams(), 1);
    return canvas;
  }

  async function copyCanvas(canvas, btn) {
    const original = btn.textContent;
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      btn.textContent = 'Copied!';
    } catch (e) {
      btn.textContent = 'Copy failed';
    }
    setTimeout(() => { btn.textContent = original; }, 1300);
  }

  function buildCard(item) {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.dataset.id = item.id;

    const wrap = document.createElement('div');
    wrap.className = 'result-canvas-wrap';
    item.canvas = document.createElement('canvas');
    wrap.appendChild(item.canvas);

    const remove = document.createElement('button');
    remove.className = 'card-remove';
    remove.title = 'Remove';
    remove.innerHTML = '&times;';
    remove.addEventListener('click', () => removeItem(item.id));

    const foot = document.createElement('div');
    foot.className = 'result-foot';
    item.meta = document.createElement('div');
    item.meta.className = 'result-meta';
    const actions = document.createElement('div');
    actions.className = 'result-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-secondary';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => copyCanvas(fullRender(item), copyBtn));

    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn-primary';
    dlBtn.textContent = 'Download';
    dlBtn.addEventListener('click', () => downloadCanvas(fullRender(item), outName(item)));

    actions.append(copyBtn, dlBtn);
    foot.append(item.meta, actions);
    card.append(remove, wrap, foot);
    results.appendChild(card);
  }

  function removeItem(id) {
    const idx = items.findIndex(it => it.id === id);
    if (idx === -1) return;
    const [item] = items.splice(idx, 1);
    if (item.url) URL.revokeObjectURL(item.url);
    const card = results.querySelector('.result-card[data-id="' + id + '"]');
    if (card) card.remove();
    if (!items.length) reset();
  }

  function addFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (!files.length) {
      showError('Please drop image files (PNG, JPEG, WebP, GIF).');
      return;
    }
    clearError();
    files.forEach(file => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const item = { id: ++idSeq, img, url, name: file.name || 'pasted-image.png' };
        items.push(item);
        buildCard(item);
        renderPreview(item);
        controls.classList.add('shown');
        btnRow.classList.add('shown');
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        showError('Could not decode "' + (file.name || 'image') + '".');
      };
      img.src = url;
    });
  }

  function reset() {
    items.forEach(it => { if (it.url) URL.revokeObjectURL(it.url); });
    items = [];
    results.innerHTML = '';
    controls.classList.remove('shown');
    btnRow.classList.remove('shown');
    fileInput.value = '';
    clearError();
  }

  // --- control wiring ---
  function bindRange(range, label, fmt) {
    const update = () => { label.textContent = fmt(+range.value); };
    range.addEventListener('input', () => { update(); scheduleRender(); });
    update();
  }
  bindRange(sizeRange, sizeVal, v => v + '%');
  bindRange(opacityRange, opacityVal, v => v + '%');
  bindRange(radiusRange, radiusVal, v => v + ' px');
  bindRange(marginRange, marginVal, v => v + ' px');

  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      bgMode = btn.dataset.bg;
      bgColor.disabled = bgMode !== 'color';
      scheduleRender();
    });
  });
  bgColor.addEventListener('input', () => { if (bgMode === 'color') scheduleRender(); });

  // --- input events ---
  fileInput.addEventListener('change', e => { if (e.target.files.length) addFiles(e.target.files); });

  ['dragenter', 'dragover'].forEach(n =>
    dropZone.addEventListener(n, e => { e.preventDefault(); dropZone.classList.add('drag-over'); }));
  ['dragleave', 'drop'].forEach(n =>
    dropZone.addEventListener(n, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); }));
  dropZone.addEventListener('drop', e => {
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  window.addEventListener('paste', e => {
    const files = [];
    for (const it of (e.clipboardData && e.clipboardData.items || [])) {
      if (it.type && it.type.startsWith('image/')) {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  downloadAll.addEventListener('click', async () => {
    for (const item of items) {
      downloadCanvas(fullRender(item), outName(item));
      await new Promise(r => setTimeout(r, 200));
    }
  });
  resetBtn.addEventListener('click', reset);

  // Don't let the browser navigate when files are dropped outside the zone.
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
</script>
</body>
</html>
